aid: chinacache
name: ChinaCache (EdgeNext)
description: >-
  ChinaCache International Holdings was one of China's earliest and largest
  content delivery network (CDN) operators, founded in 1998 and formerly listed
  on NASDAQ. Its international CDN, edge computing, and cloud security business
  now operates under the EdgeNext brand at edgenext.com, delivering content
  acceleration, DDoS/WAF security, and edge compute across a network of 1500+
  global points of presence and 90+ Tbps of capacity, with a strong footprint
  in China and other emerging markets. The company runs a customer console at
  home.console.edgenext.com with OpenID Connect (Keycloak) single sign-on and a
  REST API host at api.edgenext.com, documented in its online Document Center,
  for managing CDN domains, cache purge/prefetch, security policies, and edge
  configuration. The original chinacache.com domain now resolves to the EdgeNext
  web properties.
